# ZT9101 USB Wi-Fi driver configuration
#
# Parser-backed controls in this file are wired to cfg_parse.c/local_config.c.
# Values are parsed at module load (cfg=./wifi.cfg).
#
# SAFE / NORMAL controls are enabled below.
# EXPERIMENTAL / DANGEROUS controls are documented but COMMENTED OUT at the
# bottom of this file as requested.

# ---------- Firmware / interface ----------
fw=./fw/ZT9101_fw_c1ab8ba.bin
fw1=./fw/ZT9101V30_fw_8546b3a.bin
ifname=wlan0
if2name=wlan0

# ---------- Radio / PHY ----------
channelplan=0
# sta | ap | apsta | repeat | second | secondary | adhoc | monitor | mesh
work_mode=sta
ssid=ZT9101
channel=1
bw=40M
# auto|b|g|n|bg|gn|bn|bgn
wireless_mode=gn
# auto follows peer capability; 0 disables; 1 enables when supported.
sgi_20=auto
sgi_40=auto

# ---------- TX/RX aggregation ----------
ba_func_tx=0
ba_func_rx=0
# 0..3: HT A-MPDU length factor (8/16/32/64 KiB encoding)
max_ampdu_len_ulimit=3
# 0..3: advertised RX A-MPDU factor
max_rx_ampdu_factor=3
# 0..7: advertised A-MPDU minimum spacing/density
best_ampdu_density=7

# ---------- TX power / RF ----------
# Explicit txpower_dbm selects the driver's calibrated L/M/H RF table.
# The current source intentionally limits this interface to 0..30 dBm.
txpower_dbm=22
# Generic RF output table: 0=low, 1=medium, 2=high.
rf_power=1
# Per-silicon-generation RF selectors. 0=low, 1=medium, 2=high.
rf_power1=1
rf_power2=1
# VCO calibration/current. 0..32 are direct values; 0xff means calibration
# sentinel. Keep the known-good value here; more aggressive experiments are
# documented in the commented block at the bottom.
vco_cur=31

# ---------- Scan ----------
# Scan channel dwell is stored in an 8-bit field: 1..255 ms.
scan_ch_to=200
# Probe requests per channel: 1..8.
scan_prb_times=2
# 0=passive, 1=active.
scan_active=1
# Scan queue depth: 1..255.
scan_que_deep=64
# Scan result queue-node TTL: 1..255.
scan_que_node_ttl=18

# ---------- Rate / protection ----------
ars_policy=0
# RTS threshold: 1..2347 bytes.
rts_thresh=2347
# Fragmentation threshold: 256..2346 bytes.
frag_thresh=2346
# Virtual carrier sense: 0=off/auto, 1=force.
vcs_en=0
# 0=none, 1=RTS/CTS, 2=CTS-to-self.
vcs_type=1

# ---------- HT capability / rate-control ----------
# auto or 0..7 for the one-stream HT MCS ceiling.
ht_mcs_max=auto
ldpc_support=0
tx_stbc_support=0
sm_ps_support=0
wdn_sleep_support=1
tx_data_rpt=0

# ---------- Driver guard / bus-specific ----------
wlan_guard=1
# SDIO-only; ignored on USB hardware.
sdio_clk_pwr_save=0

# ============================================================================
# DANGEROUS / EXPERIMENTAL -- INTENTIONALLY COMMENTED OUT
# ============================================================================
# These are exposed/documented because the underlying paths exist or are
# candidates for further RF/firmware work. Do NOT enable blindly.
#
# 1) VCO boundary/sentinel experiments.  The parser accepts 0..32 and 0xff.
# vco_cur=0
# vco_cur=32
# vco_cur=0xff
# vco_curr=0xff          # legacy spelling/alias
#
# 2) Maximum RF table selection.  These are already parser-backed but can
#    change output power and calibration operating point.
# rf_power=2
# rf_power1=2
# rf_power2=2
# txpower_dbm=30
#
# 3) PHY capability forcing.  May cause interoperability/regulatory issues
#    or unstable operation if the peer/hardware does not support it.
# wireless_mode=n
# sgi_20=1
# sgi_40=1
# ldpc_support=1
# tx_stbc_support=1
# sm_ps_support=1
#
# 4) Maximum aggregation settings.  These can increase memory/latency/load.
# max_ampdu_len_ulimit=3
# max_rx_ampdu_factor=3
# best_ampdu_density=0
# ba_func_tx=1
# ba_func_rx=1
#
# 5) Protection/fragmentation extremes.
# vcs_en=1
# vcs_type=2
# rts_thresh=1
# frag_thresh=256
#
# 6) Scan stress settings.
# scan_ch_to=1
# scan_prb_times=8
# scan_que_deep=255
# scan_que_node_ttl=255
#
# 7) Alternate modes.  Mesh/IBSS paths are known to be less mature in this
#    driver; leave disabled unless specifically testing them.
# work_mode=adhoc
# work_mode=mesh
# adhoc_master=1
#
# 8) SDIO clock power-save testing (ignored by USB devices).
# sdio_clk_pwr_save=1
